<svg xmlns="http://www.w3.org/2000/svg" style="display:none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============ HERO MARK: compass / star, DXD's own geometric motif ============ -->
  <symbol id="mark-compass" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="108" fill="none" stroke="var(--border)" stroke-width="1.5"/>
    <circle class="spin-slower" cx="120" cy="120" r="80" fill="none" stroke="var(--olive-line)" stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"/>

    <g class="spin-slow" style="transform-origin:120px 120px">
      <!-- four-point astroid star -->
      <path d="M120 24 Q146,94 216,120 Q146,146 120,216 Q94,146 24,120 Q94,94 120,24 Z" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- node circles at tips -->
      <circle cx="120" cy="24" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <circle cx="216" cy="120" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <circle cx="120" cy="216" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <circle cx="24" cy="120" r="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    </g>

    <circle cx="120" cy="120" r="9" fill="var(--ink)"/>

    <!-- orbiting satellite dot -->
    <g class="spin-slow" style="transform-origin:120px 120px">
      <circle cx="120" cy="46" r="4.5" fill="var(--lime)" stroke="var(--ink)" stroke-width="2" class="pulse-soft"/>
    </g>
  </symbol>

  <!-- ============ Build & deliver: monitor + stacked blocks ============ -->
  <symbol id="illus-build" viewBox="0 0 220 180">
    <line x1="10" y1="160" x2="210" y2="160" stroke="var(--border)" stroke-width="1.5"/>
    <rect x="20" y="46" width="100" height="72" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    <path class="draw-line" style="--len:120" d="M40 66 L74 66" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <path class="draw-line" style="--len:90; --delay:120ms" d="M40 80 L92 80" stroke="var(--olive-line)" stroke-width="2.5" stroke-linecap="round"/>
    <path class="draw-line" style="--len:70" d="M40 94 L70 94" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="56" y="118" width="28" height="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    <line x1="46" y1="130" x2="94" y2="130" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>

    <g class="float-slow">
      <rect x="146" y="98" width="46" height="24" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="152" y="70" width="34" height="24" rx="5" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5"/>
      <rect x="158" y="42" width="22" height="24" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    </g>
    <circle cx="34" cy="36" r="4" fill="var(--lime)" stroke="var(--ink)" stroke-width="2" class="pulse-soft"/>
  </symbol>

  <!-- ============ Accelerate AI adoption: lightbulb + sparks ============ -->
  <symbol id="illus-ai" viewBox="0 0 220 180">
    <line x1="10" y1="160" x2="210" y2="160" stroke="var(--border)" stroke-width="1.5"/>
    <g class="float-slow" style="transform-origin:110px 90px">
      <circle cx="110" cy="80" r="38" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M96 112 L124 112 L120 130 L100 130 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="101" y1="140" x2="119" y2="140" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M96 78 Q102 60 118 62" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    </g>
    <g class="spin-slow" style="transform-origin:110px 80px">
      <path class="draw-line" style="--len:24" d="M110 16 L110 30" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path class="draw-line" style="--len:24;--delay:150ms" d="M174 80 L160 80" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path class="draw-line" style="--len:24;--delay:300ms" d="M46 80 L60 80" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path d="M162 40 L167 50 L177 55 L167 60 L162 70 L157 60 L147 55 L157 50 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" class="pulse-soft"/>
    <circle cx="50" cy="46" r="4" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>
  </symbol>

  <!-- ============ Empower users: handing a tool up a small step ============ -->
  <symbol id="illus-empower" viewBox="0 0 220 180">
    <line x1="10" y1="160" x2="210" y2="160" stroke="var(--border)" stroke-width="1.5"/>
    <rect x="128" y="132" width="30" height="28" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"/>
    <rect x="158" y="110" width="30" height="50" fill="var(--surface-2)" stroke="var(--border)" stroke-width="1.5"/>

    <!-- figure A (shorter, giving) -->
    <g class="float-slow">
      <circle cx="58" cy="88" r="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M42 160 L44 122 Q44 112 58 112 Q72 112 72 122 L74 160 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M70 118 L96 104" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- tool being passed -->
    <rect x="92" y="92" width="18" height="18" rx="4" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5" class="pulse-soft"/>

    <!-- figure B (taller, receiving, standing on step) -->
    <g class="float-slower">
      <circle cx="150" cy="66" r="14" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M134 132 L136 100 Q136 90 150 90 Q164 90 164 100 L166 132 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M136 96 L112 100" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <circle cx="30" cy="40" r="4" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>
  </symbol>

  <!-- ============ People CTA: high five ============ -->
  <symbol id="illus-people-cta" viewBox="0 0 200 160">
    <line x1="10" y1="146" x2="190" y2="146" stroke="var(--border)" stroke-width="1.5"/>
    <g>
      <circle cx="58" cy="70" r="14" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M42 146 L44 108 Q44 98 58 98 Q72 98 72 108 L74 146 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M70 104 L98 74" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g>
      <circle cx="142" cy="70" r="14" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5"/>
      <path d="M126 146 L128 108 Q128 98 142 98 Q156 98 156 108 L158 146 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M130 104 L102 74" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g class="pulse-soft">
      <path class="draw-line" style="--len:14" d="M100 58 L100 46" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path class="draw-line" style="--len:14;--delay:100ms" d="M88 66 L78 58" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
      <path class="draw-line" style="--len:14;--delay:200ms" d="M112 66 L122 58" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- ============ Story featured scene: results board ============ -->
  <symbol id="illus-story-featured" viewBox="0 0 400 260">
    <rect x="0" y="0" width="400" height="260" fill="var(--cream-1)"/>
    <line x1="0" y1="220" x2="400" y2="220" stroke="var(--border)" stroke-width="1.5"/>
    <circle cx="340" cy="46" r="26" fill="var(--lime)" stroke="var(--ink)" stroke-width="2.5" class="float-slow"/>
    <rect x="70" y="70" width="220" height="150" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    <line x1="94" y1="100" x2="200" y2="100" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="94" y1="116" x2="170" y2="116" stroke="var(--olive-line)" stroke-width="2.5" stroke-linecap="round"/>
    <g class="float-slower">
      <rect x="94" y="150" width="20" height="46" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="122" y="130" width="20" height="66" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="150" y="160" width="20" height="36" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="2"/>
      <rect x="178" y="112" width="20" height="84" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>
    </g>
    <circle cx="52" cy="188" r="5" fill="var(--lime)" stroke="var(--ink)" stroke-width="2"/>
  </symbol>

  <!-- ============ Generic photo placeholder (story grid) ============ -->
  <symbol id="illus-photo-generic" viewBox="0 0 200 130">
    <rect x="0" y="0" width="200" height="130" fill="var(--cream-1)"/>
    <circle cx="158" cy="30" r="14" fill="var(--lime)" stroke="var(--ink)" stroke-width="2" class="pulse-soft"/>
    <path d="M10 110 L60 66 L92 92 L128 54 L190 110 Z" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

</svg>
